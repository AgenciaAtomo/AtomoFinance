<!--
═══════════════════════════════════════════════════════════════════════════
  ÁTOMO FINANCE — v2
  Single-file HTML · Supabase + localStorage fallback
  + Carteiras (multi-wallet por operação)
  + Transferências internas (recarga de cartão pré-pago)
═══════════════════════════════════════════════════════════════════════════

  ┌─ MIGRAÇÃO v1 → v2 ──────────────────────────────────────────────────┐
  │  Se você JÁ rodou o SQL da v1, rode SÓ o bloco "MIGRAÇÃO" abaixo.    │
  │  Se NÃO rodou nada ainda, rode o "SETUP COMPLETO".                   │
  └──────────────────────────────────────────────────────────────────────┘

  ─── MIGRAÇÃO v1 → v2 (rode se já tinha v1) ────────────────────────────

  -- Tabela de carteiras
  create table if not exists carteiras (
    id text primary key,
    nome text not null,
    operacao text not null,
    tipo text not null default 'conta' check (tipo in ('conta', 'cartao_prepago')),
    cor text default '#908C84'
  );

  -- Adicionar colunas de carteira nas transações
  alter table transacoes
    add column if not exists carteira text references carteiras(id),
    add column if not exists carteira_destino text references carteiras(id);

  -- Liberar 'transferencia' como tipo válido
  alter table transacoes drop constraint if exists transacoes_tipo_check;
  alter table transacoes add constraint transacoes_tipo_check
    check (tipo in ('entrada', 'saida', 'transferencia'));

  alter table carteiras disable row level security;

  ─── SETUP COMPLETO (rode SÓ se nunca rodou nada) ──────────────────────

  create table if not exists categorias (
    id text primary key,
    nome text not null,
    cor text not null default '#908C84',
    tipo text not null check (tipo in ('entrada', 'saida'))
  );

  create table if not exists carteiras (
    id text primary key,
    nome text not null,
    operacao text not null,
    tipo text not null default 'conta' check (tipo in ('conta', 'cartao_prepago')),
    cor text default '#908C84'
  );

  create table if not exists transacoes (
    id text primary key,
    data date not null,
    tipo text not null check (tipo in ('entrada', 'saida', 'transferencia')),
    operacao text not null,
    valor numeric(14,2) not null,
    categoria text references categorias(id),
    carteira text references carteiras(id),
    carteira_destino text references carteiras(id),
    descricao text,
    criado_em timestamptz default now()
  );
  create index if not exists idx_tx_data on transacoes(data desc);
  create index if not exists idx_tx_op on transacoes(operacao);

  create table if not exists contas (
    id text primary key,
    tipo text not null check (tipo in ('pagar', 'receber')),
    operacao text not null,
    descricao text not null,
    valor numeric(14,2) not null,
    vencimento date not null,
    status text not null default 'aberta' check (status in ('aberta', 'paga', 'atrasada')),
    paga_em date,
    categoria text references categorias(id)
  );
  create index if not exists idx_contas_venc on contas(vencimento);

  alter table categorias disable row level security;
  alter table carteiras disable row level security;
  alter table transacoes disable row level security;
  alter table contas disable row level security;

  ═══════════════════════════════════════════════════════════════════════
-->

<style>
  :root {
    /* Paleta Claude (tema claro) */
    --bg: #F5F4ED;
    --surface: #FFFFFF;
    --surface-alt: #EFEDE4;
    --surface-warm: #FAF9F2;
    --border: #E5E2D6;
    --border-strong: #D4D0BF;
    --text: #1F1E1B;
    --text-muted: #6B6862;
    --text-subtle: #908C84;
    --accent: #C96442;
    --accent-hover: #A84F33;
    --accent-soft: #F4E4DC;
    --success: #5B7F3F;
    --success-soft: #E8EFDD;
    --danger: #A8453A;
    --danger-soft: #F2DDD9;
    --shadow-sm: 0 1px 2px rgba(31, 30, 27, 0.04);
    --shadow-md: 0 2px 8px rgba(31, 30, 27, 0.06);
    --shadow-lg: 0 8px 32px rgba(31, 30, 27, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;

    min-height: 100vh;
  }

  /* ───────── Topo ───────── */
  .header {
    border-bottom: 1px solid var(--border);
    background: var(--surface-warm);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand-mark {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .brand-mark em {
    font-style: italic;
    color: var(--accent);
    font-weight: 400;
  }
  .brand-tag {

    color: var(--text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 500;
  }

  /* Toggle de visão */
  .view-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .view-toggle button {
    background: none;
    border: none;
    padding: 7px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 7px;
    transition: all 0.15s ease;
    letter-spacing: 0.01em;
  }
  .view-toggle button:hover { color: var(--text); }
  .view-toggle button.active {
    background: var(--text);
    color: var(--bg);
  }

  .sync-indicator {
    font-size: 11px;
    color: var(--text-subtle);
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }
  .sync-dot.offline { background: var(--text-subtle); }
  .sync-dot.error { background: var(--danger); }

  /* ───────── Layout ───────── */
  .main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    overflow-x: auto;
  }
  .tab {
    background: none;
    border: none;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* Page header */
  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 400;
    font-size: 32px;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .page-subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 6px;
  }

  /* Botões */
  .btn {

    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;

  .btn-primary {

  .btn-ghost {

  .btn-danger {

    color: var(--danger);
    border-color: var(--danger-soft);
  }
  .btn-danger:hover { background: var(--danger-soft); }

  /* KPI Cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    position: relative;

    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 10px;

  .kpi-value {

    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.01em;

  .kpi-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .kpi-split {

    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .kpi-split-item {

  }
  .kpi-split-label {
    font-size: 10px;
    color: var(--text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .kpi-split-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    margin-top: 2px;
  }

  .card {

    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .card-title {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  /* Grid de duas colunas */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 768px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  /* Tabela */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th {
    text-align: left;
    padding: 14px 18px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-subtle);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    background: var(--surface-warm);
  }
  td {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-warm); }

  td.amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    text-align: right;
    font-weight: 500;
  }
  td.amount.positive { color: var(--success); }
  td.amount.negative { color: var(--danger); }

    text-align: center;

  }
  .empty-state-title {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .tag {

    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 5px;
    font-size: 11px;

  .tag-dot {

    height: 7px;

  .tag.op-b { border-color: #C2D6D5; background: #DEEDEC; color: #2C5D5B; }
  .tag.status-paga { border-color: var(--success-soft); background: var(--success-soft); color: var(--success); }
  .tag.status-aberta { border-color: var(--border); background: var(--surface-warm); color: var(--text-muted); }
  .tag.status-atrasada { border-color: var(--danger-soft); background: var(--danger-soft); color: var(--danger); }

  /* Filtros */
  .filters {

    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  /* Forms */
  .form-row {

    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 140px;

  label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-subtle);
    font-weight: 600;
  }
  input, select, textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 14px;

  }
  input:focus, select:focus, textarea:focus {

    border-color: var(--accent);

  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(31, 30, 27, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 14px;
    padding: 28px;
    max-width: 540px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }
  .modal-title {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .modal-subtitle {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .modal-actions {

    justify-content: flex-end;
    gap: 8px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  /* Chart container */
  .chart-wrap {
    position: relative;
    height: 280px;
  }

  /* Configurações */
  .config-section {
    margin-bottom: 28px;
  }
  .config-section-title {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    margin-bottom: 12px;
    color: var(--text);
  }
  .config-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: var(--surface-warm);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .config-row-info {
    flex: 1;
  }
  .config-row-name {
    font-weight: 500;
    font-size: 14px;
  }
  .config-row-meta {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 300;
    max-width: 360px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }

  /* Loading splash */
  .splash {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.3s;
  }
  .splash.hidden { opacity: 0; pointer-events: none; }
  .splash-inner {
    text-align: center;
  }
  .splash-mark {
    font-family: 'Source Serif 4', serif;
    font-size: 32px;
    letter-spacing: -0.02em;
  }
  .splash-mark em { color: var(--accent); font-style: italic; }
  .splash-tag {
    font-size: 11px;
    color: var(--text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 8px;
  }

  @media (max-width: 640px) {
    .header-inner { padding: 14px 16px; flex-wrap: wrap; }
    .main { padding: 24px 16px 60px; }
    .page-title { font-size: 26px; }
    .view-toggle button { padding: 6px 12px; font-size: 12px; }
  }
</style>
</head>

/* ═══════════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════════ */
const fmt = {
  brl: (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0),
  num: (v) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v || 0),
  data: (iso) => {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  },
  mes: (iso) => {
    if (!iso) return '—';
    const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const [y, m] = iso.split('-');
    return `${meses[parseInt(m)-1]}/${y}`;
  },
};

const uid = (prefix) => `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const todayISO = () => new Date().toISOString().slice(0, 10);

function toast(msg, kind = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + kind;
  setTimeout(() => el.classList.remove('show'), 2800);
}

function setSyncStatus(status, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  dot.className = 'sync-dot' + (status === 'online' ? '' : status === 'error' ? ' error' : ' offline');
  txt.textContent = text;
}

function getCategoria(id) {
  return state.categorias.find(c => c.id === id) || { nome: '—', cor: '#908C84' };
}

function getOperacao(id) {
  return state.config.operacoes.find(o => o.id === id) || { nome: '—', banco: '—' };
}

function getCarteira(id) {
  return state.carteiras.find(w => w.id === id) || { nome: '—', cor: '#908C84', operacao: '', tipo: 'conta' };
}

function carteirasDaOperacao(opId) {
  return state.carteiras.filter(w => w.operacao === opId);
}

// Saldo de uma carteira específica considerando entradas, saídas e transferências
function saldoCarteira(carteiraId) {
  let saldo = 0;
  state.transacoes.forEach(t => {
    if (t.tipo === 'entrada' && t.carteira === carteiraId) saldo += +t.valor;
    if (t.tipo === 'saida'   && t.carteira === carteiraId) saldo -= +t.valor;
    if (t.tipo === 'transferencia') {
      if (t.carteira === carteiraId)         saldo -= +t.valor;
      if (t.carteira_destino === carteiraId) saldo += +t.valor;
    }
  });
  return saldo;
}

// Saldo total de uma operação (soma das carteiras dela)
function saldoOperacao(opId) {
  return carteirasDaOperacao(opId).reduce((s, w) => s + saldoCarteira(w.id), 0);
}

function filteredTransacoes() {
  if (state.view === 'consolidado') return state.transacoes;
  // Inclui transações onde origem OU destino pertencem à operação
  return state.transacoes.filter(t => {
    if (t.operacao === state.view) return true;
    if (t.tipo === 'transferencia') {
      const wOrig = getCarteira(t.carteira);
      const wDest = getCarteira(t.carteira_destino);
      return wOrig.operacao === state.view || wDest.operacao === state.view;
    }
    return false;
  });
}

function filteredContas() {
  if (state.view === 'consolidado') return state.contas;
  return state.contas.filter(c => c.operacao === state.view);
}

/* ═══════════════════════════════════════════════════════════════════════
   PERSISTÊNCIA — Supabase + fallback localStorage
   ═══════════════════════════════════════════════════════════════════════ */
const LS_KEY = 'atomo_finance_v1';

function saveLocal() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    config: state.config,
    categorias: state.categorias,
    carteiras: state.carteiras,
    transacoes: state.transacoes,
    contas: state.contas,
    savedAt: new Date().toISOString(),
  }));
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    state.config = data.config || state.config;
    state.categorias = data.categorias || [];
    state.carteiras = data.carteiras || [];
    state.transacoes = data.transacoes || [];
    state.contas = data.contas || [];
    return true;
  } catch { return false; }
}

async function loadFromSupabase() {
  try {
    setSyncStatus('connecting', 'sincronizando…');
    const [cats, wlts, txs, ctas] = await Promise.all([
      db.from('categorias').select('*').order('nome'),
      db.from('carteiras').select('*').order('nome'),
      db.from('transacoes').select('*').order('data', { ascending: false }),
      db.from('contas').select('*').order('vencimento'),
    ]);

    if (cats.error) throw cats.error;
    if (wlts.error) throw wlts.error;
    if (txs.error)  throw txs.error;
    if (ctas.error) throw ctas.error;

    state.categorias = cats.data || [];
    state.carteiras  = wlts.data || [];
    state.transacoes = txs.data  || [];
    state.contas     = ctas.data || [];

    // Seed inicial de categorias
    if (state.categorias.length === 0) {
      await db.from('categorias').insert(SEED_CATEGORIAS);
      state.categorias = [...SEED_CATEGORIAS];
    }
    // Seed inicial de carteiras
    if (state.carteiras.length === 0) {
      await db.from('carteiras').insert(SEED_CARTEIRAS);
      state.carteiras = [...SEED_CARTEIRAS];
    }

    state.online = true;
    saveLocal();
    setSyncStatus('online', 'online');
    return true;
  } catch (err) {
    console.error('[Supabase] Erro ao carregar:', err);
    state.online = false;
    setSyncStatus('error', 'offline');
    return false;
  }
}

async function syncInsert(table, row) {
  if (!state.online) { saveLocal(); return; }
  try {
    const { error } = await db.from(table).insert(row);
    if (error) throw error;
  } catch (err) {
    console.error(`[Supabase] insert ${table}:`, err);
    toast('Erro ao salvar online — guardado local', 'error');
  }
  saveLocal();
}

async function syncUpdate(table, id, patch) {
  if (!state.online) { saveLocal(); return; }
  try {
    const { error } = await db.from(table).update(patch).eq('id', id);
    if (error) throw error;
  } catch (err) {
    console.error(`[Supabase] update ${table}:`, err);
    toast('Erro ao atualizar online — guardado local', 'error');
  }
  saveLocal();
}

async function syncDelete(table, id) {
  if (!state.online) { saveLocal(); return; }
  try {
    const { error } = await db.from(table).delete().eq('id', id);
    if (error) throw error;
  } catch (err) {
    console.error(`[Supabase] delete ${table}:`, err);
    toast('Erro ao deletar online — guardado local', 'error');
  }
  saveLocal();
}

function openModal(html, onMount) {
  const backdrop = document.getElementById('modal-backdrop');
  const modal = document.getElementById('modal');
  modal.innerHTML = html;
  backdrop.classList.add('open');
  if (onMount) onMount(modal);
}
function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
}
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});

function confirmAction(title, message, onConfirm) {
  openModal(`
    <div class="modal-title">${title}</div>
    <div class="modal-subtitle">${message}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confirm-yes">Confirmar</button>
    </div>
  `, (modal) => {
    modal.querySelector('#confirm-yes').onclick = () => { closeModal(); onConfirm(); };
  });
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  state.tab = btn.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
  render();
});

document.getElementById('view-toggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.view = btn.dataset.view;
  document.querySelectorAll('#view-toggle button').forEach(t => t.classList.toggle('active', t === btn));
  render();
});

   RENDER ROUTER
   ═══════════════════════════════════════════════════════════════════════ */
function render() {
  const c = document.getElementById('content');
  if (state.tab === 'dashboard')   c.innerHTML = renderDashboard();
  if (state.tab === 'transacoes')  c.innerHTML = renderTransacoes();
  if (state.tab === 'contas')      c.innerHTML = renderContas();
  if (state.tab === 'categorias')  c.innerHTML = renderCategorias();
  if (state.tab === 'config')      c.innerHTML = renderConfig();

  // Pós-render hooks
  if (state.tab === 'dashboard') drawDashboardCharts();
  attachListeners();
}

/* ═══════════════════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════════════════ */
function renderDashboard() {
  const txs = filteredTransacoes();
  const hoje = new Date();
  const inicioMes = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-01`;
  const txsMes = txs.filter(t => t.data >= inicioMes);

  // Receita/despesa só consideram entrada e saida (transferência não conta)
  const entradasMes = txsMes.filter(t => t.tipo === 'entrada').reduce((s, t) => s + +t.valor, 0);
  const saidasMes   = txsMes.filter(t => t.tipo === 'saida').reduce((s, t) => s + +t.valor, 0);

  // Saldos por operação e total
  const saldoOpA = saldoOperacao('op_a');
  const saldoOpB = saldoOperacao('op_b');
  const saldoTotal = state.view === 'consolidado' ? saldoOpA + saldoOpB :
                     state.view === 'op_a' ? saldoOpA : saldoOpB;

  const contasAbertas = filteredContas().filter(c => c.status !== 'paga');
  const contasAtrasadas = contasAbertas.filter(c => c.vencimento < todayISO());

  // Top categorias do mês (apenas saídas)
  const porCat = {};
  txsMes.filter(t => t.tipo === 'saida').forEach(t => {
    porCat[t.categoria] = (porCat[t.categoria] || 0) + +t.valor;
  });
  const topCats = Object.entries(porCat).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const ultimas = [...txs].slice(0, 8);

  // Carteiras a exibir
  const carteirasView = state.view === 'consolidado'
    ? state.carteiras
    : carteirasDaOperacao(state.view);

  const viewLabel = state.view === 'consolidado' ? 'Visão consolidada' :
                    state.view === 'op_a' ? state.config.operacoes[0].nome :
                    state.config.operacoes[1].nome;

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <div class="page-subtitle">${viewLabel} · ${fmt.mes(todayISO())}</div>
      </div>
      ${carteirasView.some(w => w.tipo === 'cartao_prepago') ? `
        <button class="btn btn-secondary" id="btn-recarregar">↻ Recarregar cartão</button>
      ` : ''}
    </div>

    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-label">Saldo total</div>
        <div class="kpi-value ${saldoTotal >= 0 ? 'positive' : 'negative'}">${fmt.brl(saldoTotal)}</div>
        ${state.view === 'consolidado' ? `
          <div class="kpi-split">
            <div class="kpi-split-item">
              <div class="kpi-split-label">${state.config.operacoes[0].nome}</div>
              <div class="kpi-split-value">${fmt.brl(saldoOpA)}</div>
            </div>
            <div class="kpi-split-item">
              <div class="kpi-split-label">${state.config.operacoes[1].nome}</div>
              <div class="kpi-split-value">${fmt.brl(saldoOpB)}</div>
            </div>
          </div>
        ` : carteirasView.length > 1 ? `
          <div class="kpi-split">
            ${carteirasView.map(w => `
              <div class="kpi-split-item">
                <div class="kpi-split-label">${w.nome}</div>
                <div class="kpi-split-value">${fmt.brl(saldoCarteira(w.id))}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
      <div class="kpi">
        <div class="kpi-label">Entradas (mês)</div>
        <div class="kpi-value positive">${fmt.brl(entradasMes)}</div>
        <div class="kpi-meta">${txsMes.filter(t => t.tipo === 'entrada').length} transações</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Saídas (mês)</div>
        <div class="kpi-value negative">${fmt.brl(saidasMes)}</div>
        <div class="kpi-meta">${txsMes.filter(t => t.tipo === 'saida').length} transações</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">A pagar/receber</div>
        <div class="kpi-value">${contasAbertas.length}</div>
        <div class="kpi-meta">${contasAtrasadas.length} atrasada(s)</div>
      </div>
    </div>

    ${state.view !== 'consolidado' && carteirasView.length > 1 ? `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-header">
          <div class="card-title">Carteiras</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${carteirasView.map(w => {
            const saldo = saldoCarteira(w.id);
            const isPrepago = w.tipo === 'cartao_prepago';
            return `
              <div class="config-row">
                <span class="tag-dot" style="background:${w.cor}; width:12px; height:12px;"></span>
                <div class="config-row-info">
                  <div class="config-row-name">${w.nome}${isPrepago ? ' <span class="tag" style="font-size:9px; margin-left:6px;">pré-pago</span>' : ''}</div>
                  <div class="config-row-meta">${state.transacoes.filter(t => t.carteira === w.id || t.carteira_destino === w.id).length} movimentações</div>
                </div>
                <div style="font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:500; color:${saldo >= 0 ? 'var(--success)' : 'var(--danger)'};">
                  ${fmt.brl(saldo)}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    ` : ''}

    <div class="grid-2">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Gastos por categoria (mês)</div>
        </div>
        ${topCats.length === 0
          ? '<div class="empty-state"><div class="empty-state-title">Sem dados</div>Nenhuma saída no mês.</div>'
          : '<div class="chart-wrap"><canvas id="chart-categorias"></canvas></div>'}
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">Fluxo dos últimos 30 dias</div>
        </div>
        ${txs.filter(t => t.tipo !== 'transferencia').length === 0
          ? '<div class="empty-state"><div class="empty-state-title">Sem dados</div>Nenhuma transação registrada.</div>'
          : '<div class="chart-wrap"><canvas id="chart-fluxo"></canvas></div>'}
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header">
        <div class="card-title">Últimas transações</div>
        <button class="btn btn-ghost" onclick="state.tab='transacoes'; document.querySelector('[data-tab=transacoes]').click();">Ver todas →</button>
      </div>
      ${ultimas.length === 0 ? `
        <div class="empty-state">
          <div class="empty-state-title">Tudo limpo por aqui</div>
          Comece registrando uma transação na aba "Transações".
        </div>
      ` : `
        <div class="table-wrap" style="border:none;">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Carteira</th>
                <th style="text-align:right;">Valor</th>
              </tr>
            </thead>
            <tbody>
              ${ultimas.map(t => renderTxRow(t, true)).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

// Render auxiliar de uma linha de transação (usado em dashboard e tabela completa)
function renderTxRow(t, compact = false) {
  const isTransfer = t.tipo === 'transferencia';
  const cat = isTransfer
    ? { nome: 'Transferência', cor: '#908C84' }
    : getCategoria(t.categoria);
  const wOrigem = getCarteira(t.carteira);
  const wDestino = getCarteira(t.carteira_destino);
  const valorClass = t.tipo === 'entrada' ? 'positive' : t.tipo === 'saida' ? 'negative' : '';
  const valorPrefix = t.tipo === 'entrada' ? '+' : t.tipo === 'saida' ? '−' : '↔';

  const carteiraCell = isTransfer
    ? `<span class="tag">${wOrigem.nome} → ${wDestino.nome}</span>`
    : `<span class="tag"><span class="tag-dot" style="background:${wOrigem.cor}"></span>${wOrigem.nome}</span>`;

  const baseRow = `
    <td style="font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-muted);">${fmt.data(t.data)}</td>
    <td>${t.descricao || '—'}</td>
    <td><span class="tag"><span class="tag-dot" style="background:${cat.cor}"></span>${cat.nome}</span></td>
    <td>${carteiraCell}</td>
    <td class="amount ${valorClass}">${valorPrefix} ${fmt.num(t.valor)}</td>
  `;

  if (compact) return `<tr>${baseRow}</tr>`;
  return `
    <tr>
      ${baseRow}
      <td style="text-align:right;">
        <button class="btn btn-ghost" data-edit-tx="${t.id}" style="padding:5px 10px;">Editar</button>
        <button class="btn btn-ghost" data-del-tx="${t.id}" style="padding:5px 10px; color:var(--danger);">Excluir</button>
      </td>
    </tr>
  `;
}

let chartCategorias, chartFluxo;
function drawDashboardCharts() {
  const txs = filteredTransacoes();
  const hoje = new Date();
  const inicioMes = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-01`;
  const txsMes = txs.filter(t => t.data >= inicioMes);

  // Categoria
  const porCat = {};
  txsMes.filter(t => t.tipo === 'saida').forEach(t => {
    porCat[t.categoria] = (porCat[t.categoria] || 0) + Number(t.valor);
  });
  const topCats = Object.entries(porCat).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const canvasCat = document.getElementById('chart-categorias');
  if (canvasCat && topCats.length) {
    if (chartCategorias) chartCategorias.destroy();
    chartCategorias = new Chart(canvasCat, {
      type: 'doughnut',
      data: {
        labels: topCats.map(([id]) => getCategoria(id).nome),
        datasets: [{
          data: topCats.map(([, v]) => v),
          backgroundColor: topCats.map(([id]) => getCategoria(id).cor),
          borderColor: '#FFFFFF',
          borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'right',
            labels: { font: { family: 'Inter', size: 12 }, color: '#1F1E1B', boxWidth: 10, padding: 12 },
          },
          tooltip: {
            callbacks: { label: (ctx) => `${ctx.label}: ${fmt.brl(ctx.raw)}` },
          },
        },
        cutout: '64%',
      },
    });
  }

  // Fluxo 30d (ignora transferências)
  const canvasFluxo = document.getElementById('chart-fluxo');
  const txsFluxo = txs.filter(t => t.tipo !== 'transferencia');
  if (canvasFluxo && txsFluxo.length) {
    const dias = [];
    const entradasDia = [];
    const saidasDia = [];
    for (let i = 29; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const iso = d.toISOString().slice(0, 10);
      dias.push(`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`);
      entradasDia.push(txsFluxo.filter(t => t.data === iso && t.tipo === 'entrada').reduce((s, t) => s + +t.valor, 0));
      saidasDia.push(txsFluxo.filter(t => t.data === iso && t.tipo === 'saida').reduce((s, t) => s + +t.valor, 0));
    }

    if (chartFluxo) chartFluxo.destroy();
    chartFluxo = new Chart(canvasFluxo, {
      type: 'line',
      data: {
        labels: dias,
        datasets: [
          { label: 'Entradas', data: entradasDia, borderColor: '#5B7F3F', backgroundColor: 'rgba(91,127,63,0.08)', fill: true, tension: 0.35, pointRadius: 0 },
          { label: 'Saídas',   data: saidasDia,   borderColor: '#A8453A', backgroundColor: 'rgba(168,69,58,0.08)', fill: true, tension: 0.35, pointRadius: 0 },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', labels: { font: { family: 'Inter', size: 12 }, color: '#1F1E1B', boxWidth: 10, padding: 12 } },
          tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${fmt.brl(ctx.raw)}` } },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#908C84', font: { size: 10 } } },
          y: { grid: { color: '#E5E2D6' }, ticks: { color: '#908C84', font: { size: 10 }, callback: (v) => `R$ ${v}` } },
        },
      },
    });
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   TRANSAÇÕES
   ═══════════════════════════════════════════════════════════════════════ */
let txFilters = { categoria: '', tipo: '', mes: '', carteira: '' };

function renderTransacoes() {
  let txs = filteredTransacoes();
  if (txFilters.categoria) txs = txs.filter(t => t.categoria === txFilters.categoria);
  if (txFilters.tipo)      txs = txs.filter(t => t.tipo === txFilters.tipo);
  if (txFilters.mes)       txs = txs.filter(t => t.data.startsWith(txFilters.mes));
  if (txFilters.carteira)  txs = txs.filter(t => t.carteira === txFilters.carteira || t.carteira_destino === txFilters.carteira);

  const carteirasView = state.view === 'consolidado'
    ? state.carteiras
    : carteirasDaOperacao(state.view);

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">Transações</h1>
        <div class="page-subtitle">${txs.length} registro(s)</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${carteirasView.some(w => w.tipo === 'cartao_prepago') ? `
          <button class="btn btn-secondary" id="btn-recarregar">↻ Recarregar cartão</button>
        ` : ''}
        <button class="btn btn-primary" id="btn-nova-tx">+ Nova transação</button>
      </div>
    </div>

    <div class="filters">
      <div class="form-row">
        <label>Tipo</label>
        <select id="f-tipo">
          <option value="">Todos</option>
          <option value="entrada"       ${txFilters.tipo === 'entrada' ? 'selected' : ''}>Entradas</option>
          <option value="saida"         ${txFilters.tipo === 'saida' ? 'selected' : ''}>Saídas</option>
          <option value="transferencia" ${txFilters.tipo === 'transferencia' ? 'selected' : ''}>Transferências</option>
        </select>
      </div>
      <div class="form-row">
        <label>Carteira</label>
        <select id="f-carteira">
          <option value="">Todas</option>
          ${carteirasView.map(w => `<option value="${w.id}" ${txFilters.carteira === w.id ? 'selected' : ''}>${w.nome}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <label>Categoria</label>
        <select id="f-cat">
          <option value="">Todas</option>
          ${state.categorias.map(c => `<option value="${c.id}" ${txFilters.categoria === c.id ? 'selected' : ''}>${c.nome}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <label>Mês</label>
        <input type="month" id="f-mes" value="${txFilters.mes}" />
      </div>
      <div class="form-row" style="flex:0 0 auto; justify-content:flex-end;">
        <label>&nbsp;</label>
        <button class="btn btn-ghost" id="btn-limpar-filtros">Limpar</button>
      </div>
    </div>

    ${txs.length === 0 ? `
      <div class="card">
        <div class="empty-state">
          <div class="empty-state-title">Nenhuma transação</div>
          ${state.transacoes.length === 0 ? 'Clique em "Nova transação" pra começar.' : 'Tente ajustar os filtros.'}
        </div>
      </div>
    ` : `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Carteira</th>
              <th style="text-align:right;">Valor</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${txs.map(t => renderTxRow(t, false)).join('')}
          </tbody>
        </table>
      </div>
    `}
  `;
}

function modalTransacao(tx = null) {
  const editing = !!tx;
  const t = tx || { data: todayISO(), tipo: 'saida', operacao: 'op_a', valor: 0, descricao: '', categoria: '', carteira: '' };

  // Carteiras disponíveis (todas no consolidado, ou da operação atual)
  const opInicial = t.operacao || (state.view === 'consolidado' ? 'op_a' : state.view);
  if (!editing && state.view !== 'consolidado') t.operacao = state.view;

  // Se a carteira atual existe, define operação a partir dela
  if (t.carteira) {
    const w = getCarteira(t.carteira);
    if (w.operacao) t.operacao = w.operacao;
  }

  openModal(`
    <div class="modal-title">${editing ? 'Editar' : 'Nova'} transação</div>
    <div class="modal-subtitle">${editing ? 'Altere os dados abaixo.' : 'Registre uma entrada ou saída de caixa.'}</div>

    <div class="grid-2">
      <div class="form-row">
        <label>Data</label>
        <input type="date" id="m-data" value="${t.data}" />
      </div>
      <div class="form-row">
        <label>Tipo</label>
        <select id="m-tipo">
          <option value="saida"   ${t.tipo === 'saida' ? 'selected' : ''}>Saída</option>
          <option value="entrada" ${t.tipo === 'entrada' ? 'selected' : ''}>Entrada</option>
        </select>
      </div>
    </div>

    <div class="form-row" style="margin-top:14px;">
      <label>Carteira (de onde sai / onde entra)</label>
      <select id="m-carteira">
        <option value="">— escolha —</option>
        ${state.carteiras.map(w => `
          <option value="${w.id}" ${t.carteira === w.id ? 'selected' : ''}>
            ${w.nome} · ${getOperacao(w.operacao).nome}${w.tipo === 'cartao_prepago' ? ' (pré-pago)' : ''}
          </option>
        `).join('')}
      </select>
    </div>

    <div class="form-row" style="margin-top:14px;">
      <label>Valor (R$)</label>
      <input type="number" id="m-valor" step="0.01" min="0" value="${t.valor}" />
    </div>

    <div class="form-row" style="margin-top:14px;">
      <label>Categoria</label>
      <select id="m-cat">
        <option value="">— escolha —</option>
        ${state.categorias.map(c => `<option value="${c.id}" ${t.categoria === c.id ? 'selected' : ''}>${c.nome}</option>`).join('')}
      </select>
    </div>

    <div class="form-row" style="margin-top:14px;">
      <label>Descrição</label>
      <input type="text" id="m-desc" placeholder="Ex: Meta Ads — campanha cliente X" value="${t.descricao || ''}" />
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="m-salvar">${editing ? 'Salvar alterações' : 'Registrar'}</button>
    </div>
  `, (modal) => {
    modal.querySelector('#m-salvar').onclick = async () => {
      const data = modal.querySelector('#m-data').value;
      const tipo = modal.querySelector('#m-tipo').value;
      const carteira = modal.querySelector('#m-carteira').value;
      const valor = parseFloat(modal.querySelector('#m-valor').value);
      const categoria = modal.querySelector('#m-cat').value;
      const descricao = modal.querySelector('#m-desc').value.trim();

      if (!data || !valor || valor <= 0 || !categoria || !carteira) {
        toast('Preencha data, carteira, valor e categoria', 'error');
        return;
      }

      const operacao = getCarteira(carteira).operacao;

      if (editing) {
        const patch = { data, tipo, operacao, carteira, valor, categoria, descricao, carteira_destino: null };
        Object.assign(tx, patch);
        await syncUpdate('transacoes', tx.id, patch);
        toast('Transação atualizada', 'success');
      } else {
        const novo = { id: uid('tx'), data, tipo, operacao, carteira, carteira_destino: null, valor, categoria, descricao };
        state.transacoes.unshift(novo);
        await syncInsert('transacoes', novo);
        toast('Transação registrada', 'success');
      }
      closeModal();
      render();
    };
  });
}

// Modal específico pra transferências/recarga de cartão
function modalTransferencia(presetCarteiraDestino = null) {
  // Default: pega o pré-pago como destino se não foi passado
  const destinoDefault = presetCarteiraDestino || state.carteiras.find(w => w.tipo === 'cartao_prepago')?.id || '';
  const destinoCarteira = getCarteira(destinoDefault);
  // Origem: outra carteira da mesma operação
  const origemDefault = state.carteiras.find(w => w.operacao === destinoCarteira.operacao && w.id !== destinoDefault)?.id || '';

  const t = {
    data: todayISO(),
    valor: 0,
    descricao: 'Recarga cartão pré-pago',
    carteira: origemDefault,
    carteira_destino: destinoDefault,
  };

  openModal(`
    <div class="modal-title">Transferência interna</div>
    <div class="modal-subtitle">Move dinheiro entre suas carteiras. <strong>Não conta como receita ou despesa.</strong></div>

    <div class="grid-2">
      <div class="form-row">
        <label>Data</label>
        <input type="date" id="m-data" value="${t.data}" />
      </div>
      <div class="form-row">
        <label>Valor (R$)</label>
        <input type="number" id="m-valor" step="0.01" min="0" value="${t.valor}" />
      </div>
    </div>

    <div class="form-row" style="margin-top:14px;">
      <label>De (origem)</label>
      <select id="m-origem">
        ${state.carteiras.map(w => `
          <option value="${w.id}" ${t.carteira === w.id ? 'selected' : ''}>
            ${w.nome} · ${fmt.brl(saldoCarteira(w.id))}
          </option>
        `).join('')}
      </select>
    </div>

    <div class="form-row" style="margin-top:14px;">
      <label>Para (destino)</label>
      <select id="m-destino">
        ${state.carteiras.map(w => `
          <option value="${w.id}" ${t.carteira_destino === w.id ? 'selected' : ''}>
            ${w.nome}${w.tipo === 'cartao_prepago' ? ' (pré-pago)' : ''}
          </option>
        `).join('')}
      </select>
    </div>

    <div class="form-row" style="margin-top:14px;">
      <label>Descrição</label>
      <input type="text" id="m-desc" value="${t.descricao}" />
    </div>

    <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:8px; padding:12px; margin-top:16px; font-size:12px; color:var(--text-muted);">
      💡 <strong>Dica:</strong> use isso pra recarregar cartão pré-pago, transferir entre bancos, etc. O dinheiro só muda de carteira — não vira despesa nem receita.
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="m-salvar">Registrar transferência</button>
    </div>
  `, (modal) => {
    modal.querySelector('#m-salvar').onclick = async () => {
      const data = modal.querySelector('#m-data').value;
      const valor = parseFloat(modal.querySelector('#m-valor').value);
      const origem = modal.querySelector('#m-origem').value;
      const destino = modal.querySelector('#m-destino').value;
      const descricao = modal.querySelector('#m-desc').value.trim();

      if (!data || !valor || valor <= 0 || !origem || !destino) {
        toast('Preencha todos os campos', 'error');
        return;
      }
      if (origem === destino) {
        toast('Origem e destino devem ser diferentes', 'error');
        return;
      }

      const novo = {
        id: uid('tx'),
        data,
        tipo: 'transferencia',
        operacao: getCarteira(origem).operacao,
        carteira: origem,
        carteira_destino: destino,
        valor,
        categoria: null,
        descricao,
      };
      state.transacoes.unshift(novo);
      await syncInsert('transacoes', novo);
      toast('Transferência registrada', 'success');
      closeModal();
      render();
    };
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   CONTAS A PAGAR/RECEBER
   ═══════════════════════════════════════════════════════════════════════ */
function renderContas() {
  // Atualiza status atrasadas
  const hoje = todayISO();
  state.contas.forEach(c => {
    if (c.status === 'aberta' && c.vencimento < hoje) c.status = 'atrasada';
  });

  const ctas = filteredContas();
  const aPagar = ctas.filter(c => c.tipo === 'pagar');
  const aReceber = ctas.filter(c => c.tipo === 'receber');

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">Contas a pagar/receber</h1>
        <div class="page-subtitle">${ctas.length} conta(s)</div>
      </div>
      <button class="btn btn-primary" id="btn-nova-conta">+ Nova conta</button>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-header">
          <div class="card-title">A pagar</div>
          <span class="tag">${aPagar.length}</span>
        </div>
        ${renderListaContas(aPagar)}
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">A receber</div>
          <span class="tag">${aReceber.length}</span>
        </div>
        ${renderListaContas(aReceber)}
      </div>
    </div>
  `;
}

function renderListaContas(lista) {
  if (lista.length === 0) {
    return '<div class="empty-state" style="padding:40px 0;">Vazio.</div>';
  }
  return `
    <div style="display:flex; flex-direction:column; gap:8px;">
      ${lista.map(c => `
        <div class="config-row">
          <div class="config-row-info">
            <div class="config-row-name">${c.descricao}</div>
            <div class="config-row-meta">
              ${fmt.brl(c.valor)} · vence ${fmt.data(c.vencimento)} · ${getOperacao(c.operacao).nome}
            </div>
          </div>
          <span class="tag status-${c.status}">${c.status}</span>
          ${c.status !== 'paga' ? `<button class="btn btn-ghost" data-pagar-conta="${c.id}" style="padding:5px 10px;">Marcar paga</button>` : ''}
          <button class="btn btn-ghost" data-edit-conta="${c.id}" style="padding:5px 10px;">Editar</button>
          <button class="btn btn-ghost" data-del-conta="${c.id}" style="padding:5px 10px; color:var(--danger);">×</button>
        </div>
      `).join('')}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════════

function renderCategorias() {

  return `

        <h1 class="page-title">Categorias</h1>
        <div class="page-subtitle">Compartilhadas entre as duas operações</div>

    <div class="grid-2">
      <div class="card">

        ${saidas.length === 0 ? '<div class="empty-state" style="padding:30px 0;">Vazio.</div>' :
          saidas.map(c => renderCatRow(c)).join('')}

        <div class="card-header"><div class="card-title">Entradas</div></div>

  });
}

/* ═══════════════════════════════════════════════════════════════════════
   CONFIGURAÇÕES
   ═══════════════════════════════════════════════════════════════════════ */
function renderConfig() {
  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">Configurações</h1>
        <div class="page-subtitle">Empresa, operações, carteiras e dados</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="config-section">
        <div class="config-section-title">Empresa</div>
        <div class="form-row">
          <label>Nome</label>
          <input type="text" id="cfg-empresa" value="${state.config.empresa}" />
        </div>
      </div>

      <div class="config-section">
        <div class="config-section-title">Operações</div>
        ${state.config.operacoes.map((o, i) => `
          <div class="config-row">
            <div class="config-row-info">
              <div class="form-row">
                <label>Operação ${i+1}</label>
                <input type="text" data-cfg-op-nome="${o.id}" value="${o.nome}" placeholder="Nome da operação" />
              </div>
              <div class="form-row" style="margin-top:8px;">
                <label>Banco</label>
                <input type="text" data-cfg-op-banco="${o.id}" value="${o.banco}" placeholder="Banco vinculado" />
              </div>
            </div>
          </div>
        `).join('')}
        <button class="btn btn-secondary" id="btn-salvar-config" style="margin-top:12px;">Salvar configurações</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="config-section">
        <div class="config-section-title">Carteiras</div>
        <p style="color:var(--text-muted); font-size:13px; margin-bottom:14px;">
          Cada operação pode ter múltiplas carteiras (conta corrente, cartão pré-pago, etc). Saldos são calculados automaticamente.
        </p>
        ${state.config.operacoes.map(o => {
          const carts = carteirasDaOperacao(o.id);
          return `
            <div style="margin-bottom:18px;">
              <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-subtle); font-weight:600; margin-bottom:8px;">
                ${o.nome}
              </div>
              ${carts.length === 0 ? '<div style="color:var(--text-muted); font-size:13px; padding:8px;">Nenhuma carteira</div>' :
                carts.map(w => `
                  <div class="config-row">
                    <span class="tag-dot" style="background:${w.cor}; width:12px; height:12px;"></span>
                    <div class="config-row-info">
                      <div class="config-row-name">${w.nome} ${w.tipo === 'cartao_prepago' ? '<span class="tag" style="font-size:9px;">pré-pago</span>' : ''}</div>
                      <div class="config-row-meta">${state.transacoes.filter(t => t.carteira === w.id || t.carteira_destino === w.id).length} movimentações · saldo ${fmt.brl(saldoCarteira(w.id))}</div>
                    </div>
                    <button class="btn btn-ghost" data-edit-w="${w.id}" style="padding:5px 10px;">Editar</button>
                    <button class="btn btn-ghost" data-del-w="${w.id}" style="padding:5px 10px; color:var(--danger);">×</button>
                  </div>
                `).join('')
              }
              <button class="btn btn-ghost" data-add-w="${o.id}" style="margin-top:6px;">+ Adicionar carteira em ${o.nome}</button>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="config-section">
        <div class="config-section-title">Backup</div>
        <p style="color:var(--text-muted); font-size:13px; margin-bottom:14px;">
          Exporte um JSON com todos seus dados ou importe de um backup anterior. Importação faz <strong>merge</strong> — não sobrescreve.
        </p>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-secondary" id="btn-export">↓ Exportar JSON</button>
          <button class="btn btn-secondary" id="btn-import">↑ Importar JSON</button>
          <input type="file" id="file-import" accept=".json" style="display:none;" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="config-section">
        <div class="config-section-title" style="color:var(--danger);">Zona de perigo</div>
        <p style="color:var(--text-muted); font-size:13px; margin-bottom:14px;">
          Apaga <strong>tudo</strong> — transações, contas e categorias. Carteiras e configurações da empresa permanecem.
        </p>
        <button class="btn btn-danger" id="btn-reset">Resetar todos os dados</button>
      </div>
    </div>
  `;
}

// Modal de carteira
function modalCarteira(carteira = null, opPreset = null) {
  const editing = !!carteira;
  const w = carteira || { nome: '', operacao: opPreset || 'op_a', tipo: 'conta', cor: '#7A6B4F' };

  openModal(`
    <div class="modal-title">${editing ? 'Editar' : 'Nova'} carteira</div>
    <div class="modal-subtitle">Carteiras são contas/cartões dentro de uma operação.</div>

    <div class="form-row">
      <label>Nome</label>
      <input type="text" id="m-nome" value="${w.nome}" placeholder="Ex: Cartão Nubank PJ" />
    </div>

    <div class="grid-2" style="margin-top:14px;">
      <div class="form-row">
        <label>Operação</label>
        <select id="m-op">
          ${state.config.operacoes.map(o => `<option value="${o.id}" ${w.operacao === o.id ? 'selected' : ''}>${o.nome}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <label>Tipo</label>
        <select id="m-tipo">
          <option value="conta"          ${w.tipo === 'conta' ? 'selected' : ''}>Conta corrente</option>
          <option value="cartao_prepago" ${w.tipo === 'cartao_prepago' ? 'selected' : ''}>Cartão pré-pago</option>
        </select>
      </div>
    </div>

    <div class="form-row" style="margin-top:14px;">
      <label>Cor</label>
      <input type="color" id="m-cor" value="${w.cor}" style="height:38px; padding:4px;" />
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="m-salvar">${editing ? 'Salvar' : 'Criar'}</button>
    </div>
  `, (modal) => {
    modal.querySelector('#m-salvar').onclick = async () => {
      const nome = modal.querySelector('#m-nome').value.trim();
      const operacao = modal.querySelector('#m-op').value;
      const tipo = modal.querySelector('#m-tipo').value;
      const cor = modal.querySelector('#m-cor').value;

      if (!nome) { toast('Nome obrigatório', 'error'); return; }

      if (editing) {
        const patch = { nome, operacao, tipo, cor };
        Object.assign(carteira, patch);
        await syncUpdate('carteiras', carteira.id, patch);
        toast('Carteira atualizada', 'success');
      } else {
        const novo = { id: uid('w'), nome, operacao, tipo, cor };
        state.carteiras.push(novo);
        await syncInsert('carteiras', novo);
        toast('Carteira criada', 'success');
      }
      closeModal();
      render();
    };
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   AÇÕES
   ═══════════════════════════════════════════════════════════════════════ */
async function pagarConta(c, carteiraId) {
  const patch = { status: 'paga', paga_em: todayISO(), carteira: carteiraId };
  Object.assign(c, patch);
  await syncUpdate('contas', c.id, patch);

  const tx = {
    id: uid('tx'),
    data: todayISO(),
    tipo: c.tipo === 'pagar' ? 'saida' : 'entrada',
    operacao: c.operacao,
    carteira: carteiraId,
    carteira_destino: null,
    valor: c.valor,
    categoria: c.categoria || (c.tipo === 'pagar' ? 'cat_outros_s' : 'cat_outros_e'),
    descricao: `[Conta] ${c.descricao}`,
  };
  state.transacoes.unshift(tx);
  await syncInsert('transacoes', tx);
  toast('Conta paga + transação registrada', 'success');
  render();
}

/* ═══════════════════════════════════════════════════════════════════════
   LISTENERS
   ═══════════════════════════════════════════════════════════════════════ */
function attachListeners() {
  // Botão recarregar cartão (aparece em dashboard e transações)
  document.getElementById('btn-recarregar')?.addEventListener('click', () => modalTransferencia());

  // Transações
  document.getElementById('btn-nova-tx')?.addEventListener('click', () => modalTransacao());
  document.querySelectorAll('[data-edit-tx]').forEach(b => b.onclick = () => {
    const tx = state.transacoes.find(t => t.id === b.dataset.editTx);
    if (tx.tipo === 'transferencia') {
      toast('Transferências não podem ser editadas — exclua e recrie', 'error');
      return;
    }
    modalTransacao(tx);
  });
  document.querySelectorAll('[data-del-tx]').forEach(b => b.onclick = () => {
    confirmAction('Excluir transação?', 'Esta ação não pode ser desfeita.', async () => {
      const id = b.dataset.delTx;
      state.transacoes = state.transacoes.filter(t => t.id !== id);
      await syncDelete('transacoes', id);
      toast('Transação excluída');
      render();
    });
  });

  // Filtros tx
  document.getElementById('f-tipo')?.addEventListener('change', (e) => { txFilters.tipo = e.target.value; render(); });
  document.getElementById('f-cat')?.addEventListener('change', (e) => { txFilters.categoria = e.target.value; render(); });
  document.getElementById('f-mes')?.addEventListener('change', (e) => { txFilters.mes = e.target.value; render(); });
  document.getElementById('f-carteira')?.addEventListener('change', (e) => { txFilters.carteira = e.target.value; render(); });
  document.getElementById('btn-limpar-filtros')?.addEventListener('click', () => { txFilters = { categoria: '', tipo: '', mes: '', carteira: '' }; render(); });

  // Contas
  document.getElementById('btn-nova-conta')?.addEventListener('click', () => modalConta());
  document.querySelectorAll('[data-edit-conta]').forEach(b => b.onclick = () => {
    const c = state.contas.find(x => x.id === b.dataset.editConta);
    modalConta(c);
  });
  document.querySelectorAll('[data-del-conta]').forEach(b => b.onclick = () => {
    confirmAction('Excluir conta?', 'Esta ação não pode ser desfeita.', async () => {
      const id = b.dataset.delConta;
      state.contas = state.contas.filter(c => c.id !== id);
      await syncDelete('contas', id);
      toast('Conta excluída');
      render();
    });
  });
  document.querySelectorAll('[data-pagar-conta]').forEach(b => b.onclick = async () => {
    const c = state.contas.find(x => x.id === b.dataset.pagarConta);
    if (!c) return;

    // Se a conta não tem carteira definida, pede pro usuário escolher
    let carteiraId = c.carteira;
    if (!carteiraId) {
      const carteirasOp = carteirasDaOperacao(c.operacao);
      if (carteirasOp.length === 0) {
        toast('Crie uma carteira pra essa operação primeiro', 'error');
        return;
      }
      if (carteirasOp.length === 1) {
        carteiraId = carteirasOp[0].id;
      } else {
        // Modal rápido pra escolher carteira
        openModal(`
          <div class="modal-title">Pagar com qual carteira?</div>
          <div class="modal-subtitle">${c.descricao} · ${fmt.brl(c.valor)}</div>
          <div class="form-row" style="margin-top:14px;">
            <label>Carteira</label>
            <select id="m-w">
              ${carteirasOp.map(w => `<option value="${w.id}">${w.nome} · ${fmt.brl(saldoCarteira(w.id))}</option>`).join('')}
            </select>
          </div>
          <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" id="m-confirmar">Confirmar pagamento</button>
          </div>
        `, (modal) => {
          modal.querySelector('#m-confirmar').onclick = async () => {
            const escolhida = modal.querySelector('#m-w').value;
            closeModal();
            await pagarConta(c, escolhida);
          };
        });
        return;
      }
    }

    await pagarConta(c, carteiraId);
  });

  // Categorias
  document.getElementById('btn-nova-cat')?.addEventListener('click', () => modalCategoria());
  document.querySelectorAll('[data-edit-cat]').forEach(b => b.onclick = () => {
    const c = state.categorias.find(x => x.id === b.dataset.editCat);
    modalCategoria(c);
  });
  document.querySelectorAll('[data-del-cat]').forEach(b => b.onclick = () => {
    const id = b.dataset.delCat;
    const usos = state.transacoes.filter(t => t.categoria === id).length;
    if (usos > 0) { toast(`Não pode excluir — ${usos} transação(ões) usam essa categoria`, 'error'); return; }
    confirmAction('Excluir categoria?', 'Esta ação não pode ser desfeita.', async () => {
      state.categorias = state.categorias.filter(c => c.id !== id);
      await syncDelete('categorias', id);
      toast('Categoria excluída');
      render();
    });
  });

  // Config
  document.getElementById('btn-salvar-config')?.addEventListener('click', () => {
    state.config.empresa = document.getElementById('cfg-empresa').value.trim() || 'Empresa';
    state.config.operacoes.forEach(o => {
      o.nome = document.querySelector(`[data-cfg-op-nome="${o.id}"]`).value.trim() || o.nome;
      o.banco = document.querySelector(`[data-cfg-op-banco="${o.id}"]`).value.trim() || o.banco;
    });
    saveLocal();
    // Atualiza toggle
    document.querySelector('[data-view="op_a"]').textContent = state.config.operacoes[0].nome;
    document.querySelector('[data-view="op_b"]').textContent = state.config.operacoes[1].nome;
    toast('Configurações salvas', 'success');
    render();
  });

  // Carteiras (na config)
  document.querySelectorAll('[data-add-w]').forEach(b => b.onclick = () => modalCarteira(null, b.dataset.addW));
  document.querySelectorAll('[data-edit-w]').forEach(b => b.onclick = () => {
    const w = state.carteiras.find(x => x.id === b.dataset.editW);
    modalCarteira(w);
  });
  document.querySelectorAll('[data-del-w]').forEach(b => b.onclick = () => {
    const id = b.dataset.delW;
    const usos = state.transacoes.filter(t => t.carteira === id || t.carteira_destino === id).length;
    if (usos > 0) { toast(`Não pode excluir — ${usos} transação(ões) usam essa carteira`, 'error'); return; }
    confirmAction('Excluir carteira?', 'Esta ação não pode ser desfeita.', async () => {
      state.carteiras = state.carteiras.filter(w => w.id !== id);
      await syncDelete('carteiras', id);
      toast('Carteira excluída');
      render();
    });
  });

  // Backup
  document.getElementById('btn-export')?.addEventListener('click', () => {
    const data = {
      meta: { app: 'Atomo Finance', exportedAt: new Date().toISOString(), version: 2 },
      config: state.config,
      categorias: state.categorias,
      carteiras: state.carteiras,
      transacoes: state.transacoes,
      contas: state.contas,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `atomo-finance-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup exportado', 'success');
  });
  document.getElementById('btn-import')?.addEventListener('click', () => document.getElementById('file-import').click());
  document.getElementById('file-import')?.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      // Merge — adiciona apenas IDs novos
      const novosCats   = (data.categorias || []).filter(c => !state.categorias.find(x => x.id === c.id));
      const novasWlts   = (data.carteiras  || []).filter(w => !state.carteiras.find(x => x.id === w.id));
      const novosTxs    = (data.transacoes || []).filter(t => !state.transacoes.find(x => x.id === t.id));
      const novasContas = (data.contas     || []).filter(c => !state.contas.find(x => x.id === c.id));

      state.categorias.push(...novosCats);
      state.carteiras.push(...novasWlts);
      state.transacoes.unshift(...novosTxs);
      state.contas.push(...novasContas);

      if (state.online) {
        if (novosCats.length)   await db.from('categorias').insert(novosCats);
        if (novasWlts.length)   await db.from('carteiras').insert(novasWlts);
        if (novosTxs.length)    await db.from('transacoes').insert(novosTxs);
        if (novasContas.length) await db.from('contas').insert(novasContas);
      }
      saveLocal();
      toast(`Importado: +${novosCats.length} cat, +${novasWlts.length} carteiras, +${novosTxs.length} tx, +${novasContas.length} contas`, 'success');
      render();
    } catch (err) {
      console.error(err);
      toast('JSON inválido', 'error');
    }
    e.target.value = '';
  });

  // Reset
  document.getElementById('btn-reset')?.addEventListener('click', () => {
    confirmAction('Resetar todos os dados?', 'Apaga transações, contas e categorias. Carteiras e configurações permanecem. Esta ação não pode ser desfeita.', async () => {
      if (state.online) {
        await Promise.all([
          db.from('transacoes').delete().neq('id', ''),
          db.from('contas').delete().neq('id', ''),
          db.from('categorias').delete().neq('id', ''),
        ]);
      }
      state.transacoes = [];
      state.contas = [];
      state.categorias = [];
      saveLocal();
      // Recria seed
      state.categorias = [...SEED_CATEGORIAS];
      if (state.online) await db.from('categorias').insert(SEED_CATEGORIAS);
      toast('Dados resetados', 'success');
      render();
    });
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════════ */
async function boot() {
  loadLocal();

  // Garante seed se nada local
  if (state.categorias.length === 0) state.categorias = [...SEED_CATEGORIAS];
  if (state.carteiras.length === 0) state.carteiras = [...SEED_CARTEIRAS];

  // Tenta sync com Supabase
  await loadFromSupabase();

  // Atualiza textos do toggle com nomes configurados
  document.querySelector('[data-view="op_a"]').textContent = state.config.operacoes[0].nome;
  document.querySelector('[data-view="op_b"]').textContent = state.config.operacoes[1].nome;

  document.getElementById('splash').classList.add('hidden');
  setTimeout(() => document.getElementById('splash').remove(), 400);

  render();
}

boot();
</script>
